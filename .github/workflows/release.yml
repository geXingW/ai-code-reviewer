name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend → backend static
        run: npm run build:backend
        working-directory: frontend

      - name: Verify frontend build output
        run: |
          test -f backend/static/index.html || {
            echo "ERROR: index.html not found in backend/static/"
            ls -la backend/static/
            exit 1
          }
          echo "Frontend build OK"
          ls -la backend/static/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Generate release SQL artifacts
        run: |
          python scripts/generate_release_sql.py --output-dir sql/
          # 校验关键输出文件存在
          test -f sql/schema-full.sql || { echo "ERROR: schema-full.sql not generated"; exit 1; }
          test -f sql/VERSION || { echo "ERROR: VERSION file not generated"; exit 1; }
          test -d sql/migrations || { echo "ERROR: migrations/ directory not generated"; exit 1; }
          MIG_COUNT=$(ls sql/migrations/*.sql 2>/dev/null | wc -l)
          echo "Generated ${MIG_COUNT} migration SQL files"
          test "$MIG_COUNT" -gt 0 || { echo "ERROR: no migration SQL files generated"; exit 1; }
          echo "SQL artifacts OK"
        working-directory: backend

      - name: Package full-stack deployment bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_NAME="ai-code-reviewer-${GITHUB_REF_NAME}"
          mkdir -p "dist/${PKG_NAME}"

          # 后端源码（拍平结构，python app.py 直接启动）
          test -f app.py || { echo "ERROR: app.py not found"; exit 1; }
          test -f __main__.py || { echo "ERROR: __main__.py not found (required for python -m app)"; exit 1; }
          cp app.py "dist/${PKG_NAME}/"
          cp main.py "dist/${PKG_NAME}/"
          cp __main__.py "dist/${PKG_NAME}/"
          cp -r api "dist/${PKG_NAME}/"
          cp -r core "dist/${PKG_NAME}/"
          cp -r engines "dist/${PKG_NAME}/"
          cp -r integrations "dist/${PKG_NAME}/"
          cp -r llm "dist/${PKG_NAME}/"
          cp -r models "dist/${PKG_NAME}/"
          cp -r repositories "dist/${PKG_NAME}/"
          cp -r schemas "dist/${PKG_NAME}/"
          cp -r services "dist/${PKG_NAME}/"
          cp -r static "dist/${PKG_NAME}/"

          # 依赖清单
          cp requirements.txt "dist/${PKG_NAME}/"

          # 数据库迁移 + 种子脚本
          cp -r alembic "dist/${PKG_NAME}/alembic"
          cp alembic.ini "dist/${PKG_NAME}/"
          cp -r scripts "dist/${PKG_NAME}/scripts"

          # 发布用 SQL 文件（全量 + 增量，由上一步生成）
          cp -r sql "dist/${PKG_NAME}/sql"

          # 配置示例
          cp ../.env.example "dist/${PKG_NAME}/env.example"

          # 部署文档
          cp ../docs/setup.md "dist/${PKG_NAME}/SETUP.md"
          cp ../README.md "dist/${PKG_NAME}/README.md"

          # 启动脚本
          cat > "dist/${PKG_NAME}/start.sh" << 'SCRIPTEOF'
          #!/usr/bin/env bash
          set -e

          # ai-code-reviewer 一键启动脚本
          # 使用前请复制 env.example 为 .env 并修改配置

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$SCRIPT_DIR"

          # 安装依赖（如果还没装）
          if ! python -c "import fastapi" 2>/dev/null; then
            echo "Installing dependencies..."
            pip install -r requirements.txt
          fi

          # 启动（自动加载 ./.env，自动执行数据库迁移）
          echo "Starting ai-code-reviewer on :8000..."
          exec python app.py --migrate
          SCRIPTEOF
          chmod +x "dist/${PKG_NAME}/start.sh"

          # systemd 示例
          cat > "dist/${PKG_NAME}/ai-code-reviewer.service.example" << 'SVCEOF'
          [Unit]
          Description=AI Code Reviewer
          After=network.target

          [Service]
          Type=simple
          User=www-data
          WorkingDirectory=/opt/ai-code-reviewer
          EnvironmentFile=/opt/ai-code-reviewer/.env
          ExecStart=/opt/ai-code-reviewer/venv/bin/python app.py --host 0.0.0.0 --port 8000 --migrate
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # 打 zip 包
          cd dist
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}/"
          ls -la "${PKG_NAME}.zip"

          # 校验 zip 包关键文件
          ZIP_SIZE=$(stat -c%s "${PKG_NAME}.zip")
          echo "Zip size: ${ZIP_SIZE} bytes"
          test "$ZIP_SIZE" -gt 1000000 || { echo "ERROR: zip too small (< 1MB), build likely failed"; exit 1; }
          unzip -l "${PKG_NAME}.zip" | grep -q "index.html" || { echo "ERROR: index.html missing from zip"; exit 1; }
          unzip -l "${PKG_NAME}.zip" | grep -q "schema-full.sql" || { echo "ERROR: schema-full.sql missing from zip"; exit 1; }
          unzip -l "${PKG_NAME}.zip" | grep -q "app.py" || { echo "ERROR: app.py missing from zip"; exit 1; }
          echo "Zip contents verified OK"
        working-directory: backend

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            backend/dist/ai-code-reviewer-*.zip
