name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend → backend static
        run: npm run build:backend
        working-directory: frontend

      - name: Verify frontend build output
        run: |
          test -f backend/app/static/index.html || {
            echo "ERROR: index.html not found in backend/app/static/"
            ls -la backend/app/static/
            exit 1
          }
          echo "Frontend build OK"
          ls -la backend/app/static/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel + sdist
        run: python -m build
        working-directory: backend

      - name: Verify distribution
        run: |
          ls -la dist/
          echo "---"
          pip install dist/*.whl --dry-run 2>&1 || true
        working-directory: backend

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: backend/dist/*
