name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend → backend static
        run: npm run build:backend
        working-directory: frontend

      - name: Verify frontend build output
        run: |
          test -f backend/static/index.html || {
            echo "ERROR: index.html not found in backend/static/"
            ls -la backend/static/
            exit 1
          }
          echo "Frontend build OK"
          ls -la backend/static/

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Package full-stack deployment bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_NAME="ai-code-reviewer-${GITHUB_REF_NAME}"
          mkdir -p "dist/${PKG_NAME}"

          # 后端源码（拍平结构，python app.py 直接启动）
          cp app.py "dist/${PKG_NAME}/"
          cp main.py "dist/${PKG_NAME}/"
          cp __main__.py "dist/${PKG_NAME}/" 2>/dev/null || true
          cp -r api "dist/${PKG_NAME}/"
          cp -r core "dist/${PKG_NAME}/"
          cp -r engines "dist/${PKG_NAME}/"
          cp -r integrations "dist/${PKG_NAME}/"
          cp -r llm "dist/${PKG_NAME}/"
          cp -r models "dist/${PKG_NAME}/"
          cp -r repositories "dist/${PKG_NAME}/"
          cp -r schemas "dist/${PKG_NAME}/"
          cp -r services "dist/${PKG_NAME}/"
          cp -r static "dist/${PKG_NAME}/"

          # 依赖清单
          cp pyproject.toml "dist/${PKG_NAME}/"

          # 数据库迁移 + 种子脚本
          cp -r alembic "dist/${PKG_NAME}/alembic"
          cp alembic.ini "dist/${PKG_NAME}/"
          cp -r scripts "dist/${PKG_NAME}/scripts"

          # 配置示例
          cp ../.env.example "dist/${PKG_NAME}/env.example"

          # 部署文档
          cp ../docs/setup.md "dist/${PKG_NAME}/SETUP.md"
          cp ../README.md "dist/${PKG_NAME}/README.md"

          # 启动脚本
          cat > "dist/${PKG_NAME}/start.sh" << 'SCRIPTEOF'
          #!/usr/bin/env bash
          set -e

          # ai-code-reviewer 一键启动脚本
          # 使用前请复制 env.example 为 .env 并修改配置

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$SCRIPT_DIR"

          # 安装依赖（如果还没装）
          if ! python -c "import fastapi" 2>/dev/null; then
            echo "Installing dependencies..."
            pip install -e .
          fi

          # 启动（自动加载 ./.env，自动执行数据库迁移）
          echo "Starting ai-code-reviewer on :8000..."
          exec python app.py --migrate
          SCRIPTEOF
          chmod +x "dist/${PKG_NAME}/start.sh"

          # systemd 示例
          cat > "dist/${PKG_NAME}/ai-code-reviewer.service.example" << 'SVCEOF'
          [Unit]
          Description=AI Code Reviewer
          After=network.target

          [Service]
          Type=simple
          User=www-data
          WorkingDirectory=/opt/ai-code-reviewer
          EnvironmentFile=/opt/ai-code-reviewer/.env
          ExecStart=/opt/ai-code-reviewer/venv/bin/python app.py --host 0.0.0.0 --port 8000 --migrate
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # 打 zip 包
          cd dist
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}/"
          ls -la "${PKG_NAME}.zip"
        working-directory: backend

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            backend/dist/ai-code-reviewer-*.zip
