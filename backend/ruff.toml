line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "ANN", "ASYNC", "S"]
ignore = ["S101", "S104", "S105", "S110"]

[lint.per-file-ignores]
# Tests use mock secrets in fixtures; suppress hard-coded password warnings.
# ANN401: fakes/stubs legitimately accept Any (providers, kwargs, overrides).
"tests/**/*.py" = ["ANN201", "ANN401", "S106", "S107"]
